<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Экскурсии">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<title>Аудиоэкскурсии</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--sub:#6e6e73;--acc:#0a84ff;--line:#e3e3e8;--ok:#30a14e}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#98989f;--line:#2c2c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 12px}
.row{display:flex;justify-content:space-between;align-items:center}
.back,.dl{background:none;border:0;color:var(--acc);font-size:17px;padding:8px 0;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--text);border:0;border-bottom:1px solid var(--line);padding:16px;font-size:17px;cursor:pointer}
.item:first-of-type{border-radius:12px 12px 0 0}.item:last-of-type{border-radius:0 0 12px 12px;border-bottom:0}.item:only-of-type{border-radius:12px}
.item small{display:block;color:var(--sub);font-size:14px;margin-top:4px}
.sub,.foot{color:var(--sub)}.foot{font-size:13px;margin:8px 4px}
#map{height:240px;border-radius:16px;background:var(--card)}
.pin span{display:flex;width:26px;height:26px;border-radius:50%;background:#ff3b30;color:#fff;font:700 13px sans-serif;align-items:center;justify-content:center;border:2px solid #fff}
.stops{color:var(--sub);font-size:13px;margin:8px 0}
.center{text-align:center}.center p{color:var(--sub);margin:4px 0 12px}
input[type=range]{width:100%;accent-color:var(--acc)}
.times{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.ctl{display:flex;justify-content:center;align-items:center;gap:32px;margin:12px 0}
.ctl button{background:none;border:0;color:var(--acc);cursor:pointer;font-size:30px}
.ctl .big{font-size:64px}
.warn{background:var(--card);border-radius:12px;padding:12px;color:#ff3b30;font-size:14px;margin:8px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>
<main id="app">Загрузка…</main>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abs=t=>new URL(t.audioURL,location.href).href;
const fmt=x=>{x=Math.floor(x||0);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const AC='audio-v1';
let cities=[],view='cities',ci=0,ti=0,banner='',map=null,objUrl=null;
const dl=new Set(),busy=new Set(),audio=new Audio();

async function loadCatalog(){
  try{
    const r=await fetch('tours.json',{cache:'no-cache'});
    if(!r.ok)throw 0;
    const d=await r.json();
    cities=d.cities;banner='';
    try{localStorage.setItem('catalog',JSON.stringify(d))}catch{}
  }catch{
    let d=null;try{d=JSON.parse(localStorage.getItem('catalog'))}catch{}
    if(d){cities=d.cities;banner='Нет связи с сервером. Показан сохранённый список.'}
    else{cities=[];banner='Не удалось загрузить список экскурсий.'}
  }
}
async function refreshDl(){
  try{(await (await caches.open(AC)).keys()).forEach(r=>dl.add(r.url))}catch{}
}

function render(){
  if(map){map.remove();map=null}
  if(view==='cities'){
    app.innerHTML=`<div class="row"><h1>Выберите город</h1><button class="dl" id="rf">⟳</button></div>`+
      cities.map((c,i)=>`<button class="item" data-c="${i}"><span>🏙 ${esc(c.name)}</span><span class="sub">${c.tours.length} ›</span></button>`).join('')+
      (banner?`<div class="foot">${esc(banner)}</div>`:'');
    $('#rf').onclick=async()=>{await loadCatalog();render()};
    app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ci=+b.dataset.c;view='tours';render()});
  }else if(view==='tours'){
    const c=cities[ci];
    app.innerHTML=`<button class="back" id="bk">‹ Города</button><h1>${esc(c.name)}</h1>`+
      c.tours.map((t,i)=>`<button class="item" data-t="${i}"><span>${esc(t.title)}<small>${esc(t.description)}</small></span><span class="sub">${dl.has(abs(t))?'<span style="color:var(--ok)">⬇︎ </span>':''}›</span></button>`).join('');
    $('#bk').onclick=()=>{view='cities';render()};
    app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ti=+b.dataset.t;view='player';render()});
  }else player();
}

async function setSource(t){
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
  const u=abs(t);
  if(dl.has(u)){
    const r=await (await caches.open(AC)).match(u);
    if(r){objUrl=URL.createObjectURL(await r.blob());audio.src=objUrl;return}
  }
  audio.src=u;
}
function showErr(m){const e=$('#err');if(e){e.textContent=m;e.hidden=false}}
function skip(s){audio.currentTime=Math.max(0,Math.min(audio.duration||1e9,audio.currentTime+s))}

async function download(t){
  const u=abs(t);busy.add(u);player(true);
  let err='';
  try{
    const r=await fetch(u);
    if(!r.ok)throw 0;
    if((r.headers.get('content-type')||'').startsWith('text')){err='По ссылке лежит не аудиофайл. Проверьте audioURL в tours.json.';throw 0}
    await (await caches.open(AC)).put(u,r);dl.add(u);
  }catch{err=err||'Не удалось скачать экскурсию. Проверьте интернет.'; if(dl.has(u))err=''}
  busy.delete(u);
  if(view==='player'&&cities[ci].tours[ti]===t){player(true);if(err)showErr(err)}
}
async function removeDl(t){
  const u=abs(t);
  try{await (await caches.open(AC)).delete(u)}catch{}
  dl.delete(u);player(true);
}

function media(t){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'Аудиоэкскурсия',album:cities[ci].name,
    artwork:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};
  h('play',()=>audio.play());h('pause',()=>audio.pause());
  h('seekbackward',()=>skip(-15));h('seekforward',()=>skip(15));
  h('seekto',e=>{audio.currentTime=e.seekTime});
}

function player(keepAudio){
  const c=cities[ci],t=c.tours[ti],u=abs(t);
  const dlIcon=busy.has(u)?'⏳':dl.has(u)?'🗑':'⬇︎';
  const st=t.stops||[];
  app.innerHTML=`<div class="row"><button class="back" id="bk">‹ ${esc(c.name)}</button><button class="dl" id="dl">${dlIcon}</button></div>
  ${st.length?'<div id="map"></div><div class="stops">'+st.map((s,i)=>`${i+1}. ${esc(s.name)}`).join(' · ')+'</div>':''}
  <div class="center"><h1>${esc(t.title)}</h1><p>${esc(t.description)}</p></div>
  <div class="warn" id="err" hidden></div>
  <input type="range" id="sl" min="0" max="100" step="0.1" value="0">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl"><button id="b15">⏪</button><button class="big" id="pp">▶️</button><button id="f15">⏩</button></div>`;
  if(st.length&&window.L){
    map=L.map('map',{zoomControl:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const pts=st.map(s=>[s.lat,s.lon]);
    if(pts.length>1){L.polyline(pts,{color:'#0a84ff',weight:4}).addTo(map);map.fitBounds(pts,{padding:[30,30],maxZoom:17})}
    else map.setView(pts[0],16);
    st.forEach((s,i)=>L.marker([s.lat,s.lon],{icon:L.divIcon({className:'pin',html:`<span>${i+1}</span>`,iconSize:[26,26]})}).addTo(map).bindPopup(esc(s.name)));
  }else if($('#map'))$('#map').style.display='none';

  const sl=$('#sl'),pp=$('#pp');
  const sync=()=>{
    sl.max=isFinite(audio.duration)?audio.duration:100;sl.value=audio.currentTime;
    $('#cur').textContent=fmt(audio.currentTime);$('#dur').textContent=fmt(audio.duration);
    pp.textContent=audio.paused?'▶️':'⏸';
  };
  audio.ontimeupdate=audio.onloadedmetadata=audio.onplay=audio.onpause=audio.onended=sync;
  audio.onerror=()=>showErr(navigator.onLine?'Не удаётся воспроизвести аудио. Проверьте ссылку в tours.json или удалите загрузку и скачайте заново.':'Нет интернета, а экскурсия не скачана.');
  sl.oninput=()=>{audio.currentTime=+sl.value};
  pp.onclick=()=>{audio.paused?audio.play().catch(()=>{}):audio.pause()};
  $('#b15').onclick=()=>skip(-15);$('#f15').onclick=()=>skip(15);
  $('#bk').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();view='tours';render()};
  $('#dl').onclick=()=>{if(busy.has(u))return;dl.has(u)?removeDl(t):download(t)};
  if(!keepAudio){setSource(t).then(()=>{media(t);sync()})}else sync();
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
Promise.all([loadCatalog(),refreshDl()]).then(render);
</script>
</body>
</html>
